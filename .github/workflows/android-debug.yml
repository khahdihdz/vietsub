name: Android Debug Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Android project modules and sources are validated at checkout.
      # The repository has gradle-wrapper.properties but is missing the
      # gradlew script and gradle-wrapper.jar. Install the pinned Gradle
      # version directly so CI can build without a checked-in wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Lint
        run: gradle lint --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists and is non-empty
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "Debug APK missing or empty" >&2
            exit 1
          fi
          echo "Built: $APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VietSubAI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
