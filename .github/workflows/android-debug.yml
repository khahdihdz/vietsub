name: Android Debug Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LOG_DIR: ${{ github.workspace }}/ci-logs
  PIPELINE_LOG: ${{ github.workspace }}/ci-logs/pipeline.log

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize live terminal logging
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          : > "$PIPELINE_LOG"
          exec > >(tee -a "$PIPELINE_LOG") 2>&1
          echo "============================================================"
          echo " VietSubAI CI / Android Debug Build"
          echo "============================================================"
          echo "Time      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner    : $RUNNER_OS"
          echo "Branch    : $GITHUB_REF_NAME"
          echo "Commit    : $GITHUB_SHA"
          echo "Run ID    : $GITHUB_RUN_ID"
          echo "============================================================"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify build environment
        shell: bash
        run: |
          set -o pipefail
          echo "===== JAVA ====="
          java -version 2>&1
          echo "===== GRADLE ====="
          gradle --version
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f ! -path './.git/*' | sort | head -300

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          echo "===== UNIT TESTS ====="
          echo "Command: gradle test --stacktrace --info"
          gradle test --stacktrace --info 2>&1 | tee -a "$PIPELINE_LOG"

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          echo "===== LINT ====="
          echo "Command: gradle lint --stacktrace --info"
          gradle lint --stacktrace --info 2>&1 | tee -a "$PIPELINE_LOG"

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          echo "===== BUILD APK ====="
          echo "Command: gradle assembleDebug --stacktrace --info"
          gradle assembleDebug --stacktrace --info 2>&1 | tee -a "$PIPELINE_LOG"

      - name: Verify APK
        shell: bash
        run: |
          set -o pipefail
          echo "===== APK VERIFICATION ====="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "::error::Debug APK is empty"
            exit 1
          fi
          echo "APK: $APK"
          echo "Size: $(du -h "$APK" | cut -f1)"
          file "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VietSubAI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Collect complete pipeline log
        if: always()
        shell: bash
        run: |
          echo "===== PIPELINE DIAGNOSTICS ====="
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "===== GIT ====="
          git status --short || true
          git log -1 --oneline || true
          echo "===== GRADLE DAEMON ====="
          gradle --status || true
          echo "===== TEST RESULTS ====="
          find . -path '*/build/test-results/*' -type f -print 2>/dev/null | sort || true
          echo "===== BUILD REPORTS ====="
          find . -path '*/build/reports/*' -type f -print 2>/dev/null | sort || true
          echo "===== APK FILES ====="
          find . -name '*.apk' -type f -exec ls -lh {} \; 2>/dev/null || true
          echo "===== END DIAGNOSTICS ====="
          touch "$PIPELINE_LOG"
          cp "$PIPELINE_LOG" "$LOG_DIR/pipeline-copy.log"
          grep -Ei 'error:|exception|failed|failure|fatal|could not|unable to|what went wrong' "$PIPELINE_LOG" > "$LOG_DIR/errors-only.log" || true

      - name: Upload complete pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-live-logs
          path: |
            ci-logs/pipeline.log
            ci-logs/pipeline-copy.log
            ci-logs/errors-only.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Print final log location
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo " LOG ARTIFACT: pipeline-live-logs"
          echo " COMPLETE LOG: ci-logs/pipeline-copy.log"
          echo " ERROR LOG   : ci-logs/errors-only.log"
          echo "============================================================"
