name: Build AI Vietsub Extension
on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.json"
      - "*.css"
      - "README.md"
      - ".github/workflows/extension.yml"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: python3 -c "import json; m=json.load(open('manifest.json')); assert m['manifest_version']==3; print(m['name'],m['version'])"
      - name: Package
        run: mkdir -p dist && zip -r dist/ai-vietsub-extension.zip . -x ".git/*" ".github/*" "dist/*"
      - uses: actions/upload-artifact@v4
        with: {name: ai-vietsub-extension, path: dist/ai-vietsub-extension.zip}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: AI Vietsub Extension (latest)
          prerelease: true
          make_latest: false
          files: dist/ai-vietsub-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}