name: Build AI Vietsub Extension

on:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/extension.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python3 -c "import json; m=json.load(open('extension/manifest.json')); assert m['manifest_version']==3; print(m['name'], m['version'])"
      - name: Package
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/ai-vietsub-extension.zip . -x "*.DS_Store"
          cd ..
          cp extension/manifest.json dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-vietsub-extension
          path: dist/
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: AI Vietsub Extension (latest)
          prerelease: true
          make_latest: false
          files: |
            dist/ai-vietsub-extension.zip
            dist/manifest.json
          body: Automated extension build from main.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
