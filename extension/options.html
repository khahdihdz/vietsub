<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Vietsub - Cài đặt</title><style>
body{max-width:760px;margin:40px auto;padding:0 20px;background:#111;color:#eee;font:15px Arial}label{display:block;margin:18px 0 7px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #444;border-radius:7px;background:#1b1b1b;color:#fff}textarea{min-height:150px}button{margin-top:18px;padding:11px 18px;border:0;border-radius:7px;cursor:pointer}.ok{color:#7ee787}
</style></head><body><h1>AI Vietsub & Dubbing</h1><p>Cấu hình OpenRouter. API key chỉ được lưu trong chrome.storage.local của extension.</p>
<label>OpenRouter API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-v1-...">
<label>Model</label><input id="model" value="google/gemini-2.5-flash" placeholder="provider/model">
<label>System prompt dịch</label><textarea id="prompt">You are a professional Vietnamese localization translator. Translate naturally, preserve context, character personality, pronouns, emotion, humor and placeholders. Never translate word-by-word. Return only the Vietnamese translation.</textarea>
<button id="save">Lưu cấu hình</button> <span id="msg"></span><script src="options.js"></script></body></html>
