<!doctype html>
<meta charset="utf-8">
<style>
body{max-width:760px;margin:40px auto;padding:0 20px;background:#111;color:#eee;font:15px Arial}
label{display:block;margin:18px 0 7px}
input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #444;border-radius:7px;background:#1b1b1b;color:#fff}
textarea{min-height:170px}
button{margin-top:18px;padding:11px 18px;border:0;border-radius:7px;cursor:pointer}
.ok{color:#7ee787}.check{display:flex;gap:8px;align-items:center;margin-top:18px}.check input{width:auto}
</style>
<h1>AI Vietsub & Dubbing</h1>
<p>API key được lưu cục bộ trong <code>chrome.storage.local</code>.</p>
<label>OpenRouter API Key</label><input id="apiKey" type="password" autocomplete="off">
<label>Model dịch</label><input id="model" value="google/gemini-2.5-flash">
<label>Model nhận dạng giọng nói (STT)</label><input id="sttModel" value="openai/whisper-large-v3-turbo">
<label>Temperature</label><input id="temperature" type="number" min="0" max="1" step=".1" value=".2">
<label>Prompt dịch theo ngữ cảnh</label>
<textarea id="prompt">You are a professional Vietnamese localization translator. Translate naturally, not word-for-word. Preserve context, character personality, relationships, pronouns, emotion, humor, profanity intensity, names, terminology and placeholders. Keep dialogue concise for subtitles.</textarea>
<label class="check"><input id="autoTranslate" type="checkbox" checked> Tự động dịch lời thoại nhận dạng sang tiếng Việt</label>
<button id="save">Lưu</button> <span id="msg"></span>
<script src="options.js"></script>
